[package]
name = "budget-app"
version = "0.1.0"
edition = "2021"
description = "Monthly budget planner with scheduled expenses and CSV import/export"

[lib]
name = "budget_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "budget-app"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
directories = "6"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
# Same winit version eframe 0.31 uses; needed for the AndroidApp type.
winit = { version = "0.30", features = ["android-native-activity"] }
# Check and request "All files access" (Android 11+).
jni = "0.21"
ndk-context = "0.1"

# Android packaging metadata (used by `cargo apk build`)
[package.metadata.android]
package = "com.hammerjones.budget"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Budget"

# Read CSVs from Downloads and save exports there.
# Android 11+: the user grants "All files access" in the app's settings.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
