[package]
name = "budget-app"
version = "0.1.0"
edition = "2021"
description = "Monthly budget planner with scheduled expenses and CSV import/export"

[lib]
name = "budget_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "budget-app"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
directories = "6"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
# Same winit version eframe 0.31 uses; needed for the AndroidApp type.
winit = { version = "0.30", features = ["android-native-activity"] }
# Check and request "All files access" (Android 11+).
jni = "0.21"
ndk-context = "0.1"

# The Android app is packaged by the Gradle project in android/ (see README).

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
